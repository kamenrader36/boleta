name: boleta

services:
  postgres:
    image: postgres:17.11
    container_name: boleta_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: boleta_backend
    ports:
      - "127.0.0.1:5111:8080"
    environment:
      - API_PORT=${API_PORT}
      - API_ENV=${API_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: boleta_frontend
    ports:
      - "127.0.0.1:5110:8080"
    environment:
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: boleta_mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    profiles:
      - dev

volumes:
  postgres_data:
