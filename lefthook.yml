pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,jsx,tsx,json,css,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      run: pnpm exec oxlint --deny-warnings
    go-fmt:
      glob: "*.go"
      run: cd apps/api && go fmt ./... && go vet ./...
    secretos:
      run: docker run --rm -v .://path zricethezav/gitleaks:v8.30.1 protect --source="//path" --staged --redact --no-banner
